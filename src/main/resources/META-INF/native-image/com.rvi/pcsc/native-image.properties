# Discover the PC/SC provider in the image, but open native libraries and OS contexts at run time.
# SunPCSC itself is kept at the security-provider initialization policy chosen by GraalVM.
Args = --add-modules=java.smartcardio \
       --enable-native-access=java.smartcardio \
       --initialize-at-run-time=javax.smartcardio.TerminalFactory,sun.security.smartcardio.PlatformPCSC,sun.security.smartcardio.PCSC,sun.security.smartcardio.PCSCTerminals
